<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>SMP Media Player</title>
  <script>
    window.__PLEX_CLIENT__ = window.__PLEX_CLIENT__ || {
      portalBaseUrl: '',
      nativePlayer: true,
      isTv: false
    };
    document.documentElement.dataset.plexClient = '1';
  </script>
  <link rel="stylesheet" href="./tailwind.css" />
  <style>
    html, body, #root { height: 100%; margin: 0; background: #09090b; color: #fafafa; }
    /* TV remote: same web UI, clearer focus + no scrollbar chrome */
    html[data-tv="1"] body {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    html[data-tv="1"] :focus {
      outline: 3px solid #f59e0b !important;
      outline-offset: 3px;
    }
    html[data-tv="1"] :focus:not(:focus-visible) {
      outline: 3px solid #f59e0b !important;
      outline-offset: 3px;
    }
    html[data-tv="1"] [data-tv-item="1"]:focus {
      outline: 3px solid #f59e0b !important;
      outline-offset: 4px;
      border-radius: 0.75rem;
      z-index: 5;
    }
    html[data-tv="1"],
    html[data-tv="1"] * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    html[data-tv="1"] *::-webkit-scrollbar {
      width: 0 !important;
      height: 0 !important;
      display: none !important;
      background: transparent !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./plex-client.js"></script>
</body>
</html>
